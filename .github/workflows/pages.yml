name: Deploy EdemGo

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          test -f src/EdemGo/index.html
          mkdir -p _site
          cp -a src/EdemGo/. _site/
          touch _site/.nojekyll

          source_files=$(find src/EdemGo -type f | wc -l)
          published_files=$(find _site -type f ! -name .nojekyll | wc -l)
          test "$source_files" -eq "$published_files"

          test -f _site/routes/moscow-sochi.html
          test -f _site/cities/sochi.html
          test -f _site/travel/sochi.html
          test -f _site/blog/kak-kupit-zhd-bilet.html
          test -f _site/css/style.css
          test -f _site/js/main.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
